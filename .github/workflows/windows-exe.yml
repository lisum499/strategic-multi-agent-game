name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: python -m pip install -e ".[desktop]"
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Test
        run: python -m unittest discover -s tests -q
      - name: Package
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name StrategicMultiAgentGame --collect-data strategic_game --collect-all webview
          --add-data "frontend/dist;web_dist" web_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: StrategicMultiAgentGame-windows
          path: dist/StrategicMultiAgentGame.exe
