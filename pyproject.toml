[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-multi-agent-game"
version = "0.3.0"
description = "Strategic multi-agent simulation with sealed simultaneous decisions"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
desktop = ["pyinstaller>=6.0"]

[project.scripts]
strategic-game = "strategic_game.cli:main"
strategic-game-gui = "strategic_game.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strategic_game = ["scenarios/*.json", "knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
