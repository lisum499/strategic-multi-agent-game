[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-multi-agent-game"
version = "0.2.0"
description = "v4.1 zero-sum crisis simulation with sealed simultaneous decisions"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strategic-game = "strategic_game.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strategic_game = ["scenarios/*.json", "knowledge/*.json", "knowledge/*.md", "prompts/*.md", "prompts/**/*.md", "prompts/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
