[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-multi-agent-game"
version = "0.1.0"
description = "Sealed simultaneous multi-agent strategic game for local LLMs"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strategic-game = "strategic_game.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
